<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" id="tache" placeholder="Entrez une tache" />
    <button id="ajouterTache">Ajouter</button>
    <ul id="listeTaches"></ul>
    <script>
        const input = document.getElementById("tache");
        const btn = document.getElementById("ajouterTache");
        const liste = document.getElementById("listeTaches");
        btn.addEventListener("click", function () {
            const li = document.createElement("li");
            const span = document.createElement("span");
            span.textContent = input.value;
            li.append(span);

            const btnDelete = document.createElement("button");
            btnDelete.textContent = " X "
            btnDelete.addEventListener("click", function () {
                li.remove();
            })
            li.append(btnDelete);

            liste.prepend(li);
        })
    </script>
</body>

</html>
