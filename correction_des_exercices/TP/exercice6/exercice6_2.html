<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span.initial {
            color: darkblue;
            font-weight: bold;
        }

        span.name {
            padding: 5px 10px;
            background-color: aliceblue;
            border-radius: 20px;
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <div id="list"></div>
    <script>
        const initials = ["A", "B", "C", "D"];
        const names = ["Alice", "Ali", "Amine", "Benoit", "Bilal", "Carla", "Charles"];
        const div = document.querySelector("#list");
        for (const initial of initials) {
            const p = document.createElement("p");
            const spanInitial = document.createElement("span");
            spanInitial.className = "initial";
            spanInitial.textContent = initial + " : ";
            p.append(spanInitial);
            let c = 0;
            for (const name of names) {

                if (name[0] === initial) {
                    c = 1;
                    const spanName = document.createElement("span");
                    spanName.className = "name"
                    spanName.textContent = name;
                    p.append(spanName);
                }

            }
            if (c === 0) {
                const span = document.createElement("span");
                span.textContent = "Pas de noms!";
                p.append(span);
            }
            div.append(p);
        }


    </script>
</body>

</html>
